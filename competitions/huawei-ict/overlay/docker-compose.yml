services:
  postgres:
    # The supplied pg_dump was produced by PostgreSQL 18.
    image: postgres:18
    environment:
      POSTGRES_DB: zhiyan
      POSTGRES_USER: zhiyan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Docker Compose}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - zhiyan-postgres18:/var/lib/postgresql
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  zhiyan-postgres18:
