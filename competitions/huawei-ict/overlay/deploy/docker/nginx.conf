# 本机部署：只监听容器内 80 端口，由 docker-compose 发布到宿主回环地址。
# 不配置 TLS：本机回环访问不经过网络，域名与证书留给正式部署时处理。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 现有 PDF/docx 上传上限 50 MiB，留出 multipart 开销。
    client_max_body_size 55m;

    # 静态产物带内容哈希，可长期缓存；index.html 必须每次校验，
    # 否则前端更新后用户仍会拿到旧的入口文件。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        # AI 任务是长连接轮询与流式输出，必须关闭缓冲并放宽超时，
        # 否则生成中途会被 502 截断。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 单页应用：未命中的路径交回 index.html 由前端路由处理。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
