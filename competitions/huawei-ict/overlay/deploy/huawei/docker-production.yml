services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.2@sha256:21f64facd9a01bedcf1ee190f73246220a540f4a87bfbfa3c4e18d9681becd4d
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:?请配置 Elasticsearch 密码}
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 2g
    networks:
      - search-private
    volumes:
      - zhiyan-esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail --user \"elastic:$$ELASTIC_PASSWORD\" http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
  # 生产环境的数据库和缓存使用华为云托管服务：RDS for PostgreSQL 与 DCS Redis。
  # 这两个容器因此归入一个不会被启用的 profile（预检禁止设置 COMPOSE_PROFILES），
  # 不会在云主机上启动，也不会创建数据库数据卷。
  db:
    profiles: ["bundled-services"]
  redis:
    profiles: ["bundled-services"]
  backend:
    image: zhiyan-production-backend:release
    build:
      args:
        # 完整交付必须包含这两个现有功能的 CPU 运行时，不能由外部环境变量静默关闭。
        INSTALL_FORMULA_RUNTIME: "true"
        INSTALL_PPT_RUNTIME: "true"
    volumes:
      - type: bind
        source: ${ZHIYAN_RELEASE_DIR:?请配置已校验的代码快照}
        target: /srv/zhiyan
        read_only: true
      - type: bind
        source: ${ZHIYAN_DEPLOY_ROOT:?请配置私有数据根目录}/文献/arxiv
        target: /data/knowledge-base/reference-pdfs
        read_only: true
      - type: bind
        source: ${ZHIYAN_DEPLOY_ROOT:?请配置私有数据根目录}/补充
        target: /restore
        read_only: true
    networks:
      - default
      - search-private
    # !override 替换而不是合并基础文件里的依赖：后端不再等待本机 db / redis 容器。
    # 需要 Docker Compose 2.24.6 或更高版本。
    depends_on: !override
      mermaid:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zhiyan}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:?请配置 RDS 实例的内网地址 POSTGRES_HOST}:${POSTGRES_SERVER_PORT:-5432}/${POSTGRES_DB:-zhiyan}
      REDIS_URL: ${REDIS_URL:?请配置 DCS Redis 的连接地址 REDIS_URL}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?请配置 PUBLIC_ORIGIN}
      AUTH_COOKIE_SECURE: "true"
  mermaid-init:
    image: zhiyan-production-backend:release
  mermaid:
    image: zhiyan-production-backend:release
  web:
    volumes:
      - ../huawei/nginx-docker-production.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ${ZHIYAN_DEPLOY_ROOT:?请配置私有数据根目录}/deploy/huawei/tls
        target: /etc/nginx/zhiyan-tls
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  zhiyan-esdata:

networks:
  search-private:
    internal: true
